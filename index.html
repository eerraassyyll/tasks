<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section style="background-color: antiquewhite;">
            <h2>Подсчет умной суммы</h2>
            <button id="smartsum">Calc</button>
        </section>
        <section style="background-color:azure">
            <h2>Палиндром</h2>
            <button id="palindrom">Get</button>
        </section>
        <section style="background-color:aquamarine">
            <h2>RLE</h2>
            <button id="rle">Compress</button>
        </section>
        <section style="background-color:honeydew">
            <h2>табл умножения</h2>
            <div class="table"></div>
            <button id="umnozhenie">generate</button>
        </section>
        <section style="background-color:lime">
            <h2>случ пароль</h2>
            <button id="randpswrd">Calc</button>
        </section>
        <section style="background-color:lightcoral">
            <h2>Сортировка bubble</h2>
            <button id="buble">Calc</button>
        </section>
        <section style="background-color:lightcyan">
            <h2>Timer exam</h2>
            <h3 class="timer">00:00</h3>
            <button id="examtimer_start">Start</button>
            <button id="examtimer_pause">Pause</button>
            <button id="examtimer_reset">Reset</button>
        </section>
    </main>

    <script src="script.js"> </script>
</body>
</html>
