<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Список проектов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Список проектов</h1>
    <div id="stats" class="stats"></div>

    <form id="form">
        <input type="hidden" id="editingId">
        <input type="text" id="title" placeholder="Название проекта" required>
        <input type="text" id="category" placeholder="Участник" required>
        <input type="number" id="value" placeholder="% готовности (0-100)" min="0" max="100" required>
        <select id="status">
            <option value="active">Active</option>
            <option value="done">Done</option>
            <option value="archived">Archived</option>
        </select>
        <button type="submit" id="submitBtn">Сохранить</button>
        <button type="button" id="resetBtn">Сброс</button>
    </form>

    <div class="search">
        <input type="text" id="searchInput" placeholder="Поиск по названию...">
        
        <label>Статус:</label>
        <select id="filterStatus">
            <option value="all">Все</option>
            <option value="active">Active</option>
            <option value="done">Done</option>
            <option value="archived">Archived</option>
        </select>

        <label>Сортировка по %:</label>
        <select id="sortValue">
            <option value="none">---</option>
            <option value="asc">Возрастание</option>
            <option value="desc">Убывание</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Проект</th>
                <th>Участник</th>
                <th>% готовности</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
